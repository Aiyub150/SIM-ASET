<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <!-- Background Kotak Melengkung -->
    <rect width="400" height="400" rx="80" fill="#0d6efd" />
    
    <!-- Siluet Kubus (Fisik Aset) -->
    <path d="M200 120 L280 160 L200 200 L120 160 Z" fill="#ffffff" />
    <path d="M120 160 L200 200 L200 280 L120 240 Z" fill="#e6f0ff" />
    <path d="M280 160 L200 200 L200 280 L280 240 Z" fill="#b3d4ff" />
    
    <!-- Garis Sirkulasi (Siklus Peminjaman) -->
    <path d="M 120 260 C 70 220, 70 140, 110 100" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    <path d="M 280 100 C 330 140, 330 220, 290 260" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" />
    
    <!-- Titik Node (Audit Trail) -->
    <circle cx="110" cy="100" r="14" fill="#ffffff" />
    <circle cx="290" cy="260" r="14" fill="#ffffff" />
</svg>
